<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#2d2d33"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg2)"/>

  <!-- MRI slice scan lines -->
  <g stroke="#e4e4e7" stroke-width="1" opacity="0.15">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
  </g>

  <!-- concentric segmentation contours: epicardium / myocardium / endocardium -->
  <g fill="none" stroke-width="4">
    <ellipse cx="620" cy="330" rx="150" ry="150" stroke="#e4e4e7" opacity="0.55"/>
    <ellipse cx="620" cy="330" rx="105" ry="105" stroke="#b45309"/>
    <ellipse cx="620" cy="330" rx="55" ry="55" stroke="#e4e4e7" opacity="0.8"/>
  </g>
  <!-- second decoder contour, dashed, showing the dual-decoder motif -->
  <ellipse cx="620" cy="330" rx="112" ry="112" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 6" opacity="0.6"/>

</svg>
