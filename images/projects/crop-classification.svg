<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#2d2d33"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg3)"/>

  <!-- field parcel grid, classified plots -->
  <g>
    <!-- base grid -->
    <g stroke="#e4e4e7" stroke-width="1.5" opacity="0.35" fill="none">
      <rect x="430" y="180" width="340" height="300"/>
      <line x1="497" y1="180" x2="497" y2="480"/>
      <line x1="564" y1="180" x2="564" y2="480"/>
      <line x1="631" y1="180" x2="631" y2="480"/>
      <line x1="698" y1="180" x2="698" y2="480"/>
      <line x1="430" y1="230" x2="770" y2="230"/>
      <line x1="430" y1="280" x2="770" y2="280"/>
      <line x1="430" y1="330" x2="770" y2="330"/>
      <line x1="430" y1="380" x2="770" y2="380"/>
      <line x1="430" y1="430" x2="770" y2="430"/>
    </g>
    <!-- classified (highlighted) parcels -->
    <g fill="#b45309" opacity="0.85">
      <rect x="497" y="230" width="67" height="50"/>
      <rect x="631" y="280" width="67" height="50"/>
      <rect x="564" y="380" width="67" height="50"/>
      <rect x="698" y="180" width="67" height="50"/>
      <rect x="430" y="330" width="67" height="50"/>
    </g>
  </g>

  <!-- orbiting satellite path -->
  <g fill="none" stroke="#e4e4e7" stroke-width="1.5" opacity="0.5">
    <ellipse cx="600" cy="330" rx="360" ry="120"/>
  </g>
  <circle cx="960" cy="330" r="7" fill="#fafafa"/>
  <line x1="960" y1="330" x2="960" y2="360" stroke="#fafafa" stroke-width="2"/>
  <line x1="945" y1="345" x2="975" y2="345" stroke="#fafafa" stroke-width="2"/>

</svg>
